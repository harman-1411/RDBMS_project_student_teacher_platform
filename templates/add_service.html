
{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card service-form-card">
        <div class="auth-icon">🛠️</div>

        <h1>Offer a Service</h1>
        <p class="auth-subtitle">
            Share your skills and help your campus community.
        </p>

        <form method="POST" action="{{ url_for('add_service') }}">

            <div class="form-group">
                <label for="title">Service Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. Python Programming Help"
                    required
                >
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Choose a category</option>
                    <option value="Programming">Programming</option>
                    <option value="Tutoring">Tutoring</option>
                    <option value="Design">Graphic Design</option>
                    <option value="Writing">Writing</option>
                    <option value="Photography">Photography</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Explain what you offer..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.01"
                    placeholder="Enter your price"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Publish Service →
            </button>
        </form>

        <a href="{{ url_for('dashboard') }}" class="back-home">
            ← Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
